apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: upstream-mcp-internal, namespace: {{ .Values.namespace }} }
spec:
  podSelector: { matchLabels: { tier: upstream } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: gateway } } }]
      ports: [{ protocol: TCP, port: 8010 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-ingress, namespace: {{ .Values.namespace }} }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: gateway } } }, { podSelector: { matchLabels: { app: provisioner } } }]
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mariadb-ingress, namespace: {{ .Values.namespace }} }
spec:
  podSelector: { matchLabels: { app: wordpress-db } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: wordpress } } }]
      ports: [{ protocol: TCP, port: 3306 }]
