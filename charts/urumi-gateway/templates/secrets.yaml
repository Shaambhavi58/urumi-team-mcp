{{- $existing := (lookup "v1" "Secret" .Values.namespace "urumi-secrets") | default dict }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata: { name: urumi-secrets, namespace: {{ .Values.namespace }} }
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default (get $data "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 40) | quote }}
  MARIADB_PASSWORD: {{ .Values.secrets.mariadbPassword | default (get $data "MARIADB_PASSWORD" | b64dec) | default (randAlphaNum 40) | quote }}
  MARIADB_ROOT_PASSWORD: {{ .Values.secrets.mariadbRootPassword | default (get $data "MARIADB_ROOT_PASSWORD" | b64dec) | default (randAlphaNum 40) | quote }}
  APP_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | default (get $data "APP_ENCRYPTION_KEY" | b64dec) | default (randAlphaNum 32 | b64enc) | quote }}
  WOO_CONSUMER_KEY: {{ .Values.secrets.wooConsumerKey | default (get $data "WOO_CONSUMER_KEY" | b64dec) | quote }}
  WOO_CONSUMER_SECRET: {{ .Values.secrets.wooConsumerSecret | default (get $data "WOO_CONSUMER_SECRET" | b64dec) | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default (get $data "OPENAI_API_KEY" | b64dec) | quote }}
