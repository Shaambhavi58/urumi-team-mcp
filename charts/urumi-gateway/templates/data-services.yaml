apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: {{ .Values.namespace }} }
spec: { selector: { app: postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: {{ .Values.namespace }} }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          env:
            - { name: POSTGRES_DB, value: urumi }
            - { name: POSTGRES_USER, value: urumi }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: urumi-secrets, key: POSTGRES_PASSWORD } } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U urumi"] }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 5432 }, initialDelaySeconds: 30, timeoutSeconds: 3, failureThreshold: 6 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources: {{ toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.persistence.gatewaySize }} } }
---
apiVersion: v1
kind: Service
metadata: { name: wordpress-db, namespace: {{ .Values.namespace }} }
spec: { selector: { app: wordpress-db }, ports: [{ port: 3306, targetPort: 3306 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: wordpress-db, namespace: {{ .Values.namespace }} }
spec:
  serviceName: wordpress-db
  replicas: 1
  selector: { matchLabels: { app: wordpress-db } }
  template:
    metadata: { labels: { app: wordpress-db } }
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb }}
          env:
            - { name: MARIADB_DATABASE, value: wordpress }
            - { name: MARIADB_USER, value: wp }
            - { name: MARIADB_PASSWORD, valueFrom: { secretKeyRef: { name: urumi-secrets, key: MARIADB_PASSWORD } } }
            - { name: MARIADB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: urumi-secrets, key: MARIADB_ROOT_PASSWORD } } }
          ports: [{ containerPort: 3306 }]
          readinessProbe: { exec: { command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p$MARIADB_ROOT_PASSWORD"] }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 3306 }, initialDelaySeconds: 60, timeoutSeconds: 3, failureThreshold: 6 }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
          resources: {{ toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.persistence.mariadbSize }} } }
